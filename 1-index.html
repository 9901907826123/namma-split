<div class="app" id="app"></div>
<script>
'use strict';
/* ============ data layer ============ */
const KEY = 'namma-split.pwa.v1';
const YOU = 'You';
const CFG = window.NAMMA_CONFIG || {};
let sb = null, SBU = null, MYNAME = '', MYMAP = {}, syncTimer = null, rtChannel = null;
let loginSent = false, loginBusy = false, loginErr = '', joinBusy = false, joinErr = '', ngShared = true;

const H = 3600e3, D = 24 * H;
let S = { groups: [], expenses: [], payments: [], upiIds: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let idc = 0;
function newId(p) { idc++; return p + Date.now().toString(36) + idc.toString(36); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n) { const v = Math.round(n * 100) / 100; return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: v % 1 ? 2 : 0 }); }
function getGroup(id) { return S.groups.find(g => g.id === id); }
function memberNet(groupId) {
    const net = {}; const g = getGroup(groupId); if (!g) return net;
    g.members.forEach(m => { net[m] = 0; });
    S.expenses.filter(e => e.groupId === groupId && !e.settled).forEach(e => {
        net[e.paidBy] = (net[e.paidBy] || 0) + e.amount;
        Object.entries(e.splits).forEach(([m, sh]) => { net[m] = (net[m] || 0) - sh; });
    });
    S.payments.filter(p => p.groupId === groupId).forEach(p => {
        net[p.from] = (net[p.from] || 0) + p.amount;
        net[p.to] = (net[p.to] || 0) - p.amount;
    });
    return net;
}
function simplifyDebts(net) {
    const ds = Object.entries(net).filter(([,v]) => v < -0.5).map(([m,v]) => ({ m, a: -v })).sort((x,y) => y.a - x.a);
    const cs = Object.entries(net).filter(([,v]) => v > 0.5).map(([m,v]) => ({ m, a: v })).sort((x,y) => y.a - x.a);
    const out = []; let i = 0, j = 0;
    while (i < ds.length && j < cs.length) {
        const pay = Math.min(ds[i].a, cs[j].a);
        out.push({ from: ds[i].m, to: cs[j].m, amount: pay });
        ds[i].a -= pay; cs[j].a -= pay;
        if (ds[i].a < 0.5) i++; if (cs[j].a < 0.5) j++;
    }
    return out;
}

function supaReady() { return !!(CFG.supabaseUrl && CFG.anonKey && window.supabase); }
function toYouIn(rid, name) { return name === MYMAP[rid] ? YOU : name; }
function fromYouIn(rid, name) { return name === YOU ? (MYMAP[rid] || MYNAME || 'Me') : name; }
function clearRemote() { S.groups = S.groups.filter(g => !g.remote); S.expenses = S.expenses.filter(e => !e.remote); S.payments = S.payments.filter(p => !p.remote); MYMAP = {}; }

async function loadProfile() {
    const { data } = await sb.from('profiles').select('display_name').eq('id', SBU.id).maybeSingle();
    MYNAME = (data && data.display_name) || '';
}
async function syncRemote() {
    if (!sb || !SBU) return;
    const { data: mems, error } = await sb.from('group_members').select('group_id,name').eq('user_id', SBU.id);
    if (error) { console.warn('sync', error); return; }
    clearRemote();
    if (mems && mems.length) {
        const gids = mems.map(m => m.group_id);
        mems.forEach(m => { MYMAP[m.group_id] = m.name; });
        const [gq, mq, eq, sq] = await Promise.all([
            sb.from('groups').select('*').in('id', gids),
            sb.from('group_members').select('*').in('group_id', gids),
            sb.from('expenses').select('*').in('group_id', gids),
            sb.from('settlements').select('*').in('group_id', gids),
        ]);
        (gq.data || []).forEach(g => {
            const gm = (mq.data || []).filter(m => m.group_id === g.id);
            S.groups.push({ id: 'r_' + g.id, rid: g.id, name: g.name, icon: g.emoji || '🍛', tint: GTINTS[(g.id.charCodeAt(0) + g.id.charCodeAt(1)) % GTINTS.length], members: gm.map(m => toYouIn(g.id, m.name)), remote: true, inviteCode: g.invite_code });
        });
        (eq.data || []).forEach(e => {
            S.expenses.push({ id: 'r_' + e.id, groupId: 'r_' + e.group_id, title: e.description, amount: Number(e.amount), paidBy: toYouIn(e.group_id, e.paid_by), date: new Date(e.created_at).getTime(), category: e.category || 'Other', splits: Object.fromEntries((e.split || []).map(x => [toYouIn(e.group_id, x.name), Number(x.share)])), remote: true });
        });
        (sq.data || []).forEach(p => {
            S.payments.push({ id: 'r_' + p.id, groupId: 'r_' + p.group_id, from: toYouIn(p.group_id, p.from_name), to: toYouIn(p.group_id, p.to_name), amount: Number(p.amount), date: new Date(p.created_at).getTime(), method: p.method || 'UPI', remote: true });
        });
    }
    save();
}
function debSync() { clearTimeout(syncTimer); syncTimer = setTimeout(async () => { await syncRemote(); render(); }, 600); }
function subscribeRemote() {
    if (!sb) return;
    if (rtChannel) sb.removeChannel(rtChannel);
    rtChannel = sb.channel('namma-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, debSync)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settlements' }, debSync)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, debSync)
        .subscribe();
}

    await syncRemote();

async function supaBoot() {
    if (!supaReady()) return;
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.anonKey);
    try {
        const { data } = await sb.auth.getSession();
        if (data && data.session) { SBU = data.session.user; await afterLogin(); }
    } catch (e) { console.warn(e); }
    sb.auth.onAuthStateChange(async (ev, sess) => {
        if (ev === 'SIGNED_IN' && sess && sess.user && !SBU) { SBU = sess.user; await afterLogin(); }
        else if (ev === 'SIGNED_OUT') { SBU = null; MYNAME = ''; clearRemote(); save(); render(); }

    subscribeRemote();
}

        + `<div class="profile-card">${avatar(SBU && MYNAME ? MYNAME : YOU, 56)}<div class="p-name">${SBU && MYNAME ? esc(MYNAME) : 'Me'}</div><div class="p-sub">${S.groups.length} groups · ${S.expenses.length} expenses · ${S.payments.length} payments</div></div>`
        + acc
        + `<div class="section"><h2>Your data</h2><div class="infocard">Phone-only groups stay on this phone. Shared groups sync securely so invited friends see the same expenses and balances.</div></div>`
        + `<div class="section"><h2>Start over</h2><button class="pill" style="background:#FDECEC;color:#E5484D" onclick="if(confirm('Delete phone-only groups, expenses and payments from this phone? Shared groups stay safe for your friends.')){S.groups=S.groups.filter(g=>g.remote);S.expenses=S.expenses.filter(e=>e.remote);S.payments=S.payments.filter(p=>p.remote);S.upiIds={};save();ui.openGroupId=null;ui.addForm=null;location.hash='#/';render();}">Clear phone data</button></div>`
        + `<div class="section"><div class="hint">ನಮ್ಮ Split · v2</div></div>`
        + bottomNav('profile');
}
async function pfSaveName() {
    const v = (document.getElementById('pf-name').value || '').trim();
    if (!v) return;
    await sb.from('profiles').update({ display_name: v }).eq('id', SBU.id);
    MYNAME = v; localStorage.setItem(KEY + '.nameSet', '1');
    debSync(); render();
}

/* ---- router ---- */
function render() {
    const h = location.hash || '#/';
    const el = document.getElementById('app');
    let html;
    if (h.startsWith('#/groups')) html = scrGroups();
    else if (h.startsWith('#/activity')) html = scrActivity();
    else if (h.startsWith('#/group')) html = scrGroup();
    else if (h.startsWith('#/add')) html = scrAdd();
    else if (h.startsWith('#/settle')) html = scrSettle();
    else if (h.startsWith('#/new-group')) html = scrNewGroup();
    else if (h.startsWith('#/profile')) html = scrProfile();
    else if (h.startsWith('#/login')) html = scrLogin();
    else if (h.startsWith('#/join')) html = scrJoin();
    else if (h.startsWith('#/name')) html = scrName();
    else html = scrHome();
    el.innerHTML = html;
    window.scrollTo(0, 0);
}
supaBoot();

</script>
