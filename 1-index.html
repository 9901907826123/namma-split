<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ನಮ್ಮ Split</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ನಮ್ಮ Split">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --p1:#0F172A; --p2:#1E293B; --p3:#334155; --ptint:#FDF0E0; --ptext:#B45309; --owed:#0B8A6B; --owedtint:#E5F6F1; --owe:#E5484D; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#E8E4DE; font-family:'Inter',-apple-system,'Segoe UI',Roboto,'Noto Sans Kannada',sans-serif,'Noto Color Emoji'; color:#111; }
.app { max-width:430px; margin:0 auto; background:#F6F7F9; min-height:100vh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
.app a { text-decoration:none; color:inherit; cursor:pointer; }
.app a.settle-btn { color:var(--ptext); }
.app a.fab { color:#fff; }
.app a.pill.pay { color:#fff; }
.app a.save, .app a.add-btn, .app a.cta { color:#fff; }
.app a.newgroup { color:var(--ptext); }
.app a.auth-btn { color:#fff; }
.app a.back { color:#374151; }
:where(.app) button { font-family:inherit; cursor:pointer; border:none; background:none; }
.app input, .app select { font-family:inherit; }
.cur-sel { font-size:24px; font-weight:800; color:var(--ptext); background:none; border:none; padding:0; margin-right:2px; }
.rcpt { display:flex; align-items:center; gap:12px; }
.rcpt img { max-width:110px; max-height:140px; border-radius:12px; box-shadow:0 1px 4px rgba(16,24,40,.18); }
.tag.disputed { background:#FDECEC; color:#E5484D; }
.hist { font-size:12.5px; color:#6B7280; padding:7px 0; border-bottom:1px solid #F0F1F4; line-height:1.45; }
.hist b { color:#374151; }
.seen-note { font-size:12px; color:#6B7280; margin-top:8px; line-height:1.5; }
h1 { margin:0; } h2 { font-size:15px; font-weight:700; color:#111; margin:0 0 10px; }
.header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 12px; }
.logo { font-size:22px; font-weight:800; color:var(--ptext); letter-spacing:-.5px; font-family:'Noto Sans Kannada','Inter',sans-serif; }
.logo span { color:#111; font-family:'Inter',sans-serif; }
.header .right { display:flex; gap:14px; align-items:center; min-width:34px; }
.avatar { border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
.back { width:34px; height:34px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; color:#374151; box-shadow:0 1px 3px rgba(16,24,40,.08); }
.htext { flex:1; padding:0 12px; }
.htext h1 { font-size:17px; font-weight:700; }
.htext .sub { font-size:12px; color:#6B7280; margin-top:1px; }
.balance-card { margin:6px 16px 14px; border-radius:20px; padding:18px; background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 60%,var(--p3) 100%); color:#fff; box-shadow:0 8px 20px rgba(15,23,42,.35); }
.balance-card .label { font-size:12.5px; opacity:.85; font-weight:500; }
.balance-card .big { font-size:30px; font-weight:800; margin:2px 0 12px; letter-spacing:-.5px; font-family:'Noto Sans Kannada','Inter',sans-serif; }
.balance-row { display:flex; justify-content:space-between; align-items:flex-end; }
.mini { display:flex; gap:18px; }
.mini .item .k { font-size:11px; opacity:.8; }
.mini .item .v { font-size:15px; font-weight:700; }
.settle-btn { background:#fff; color:var(--ptext); font-weight:700; font-size:13px; padding:9px 16px; border-radius:12px; white-space:nowrap; }
.gsummary { display:flex; justify-content:space-between; }
.gstat { text-align:center; }
.gstat .gv { font-size:16px; font-weight:800; }
.gstat .gk { font-size:10.5px; opacity:.8; margin-top:2px; }
.section { padding:0 20px; margin-bottom:14px; }
.section-title { display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px; }
.section-title h2 { margin:0; font-size:16px; }
.section-title .link { font-size:12.5px; font-weight:600; color:var(--ptext); }
.group { display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:12px 14px; margin-bottom:9px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.group .icon { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.group .info { flex:1; min-width:0; }
.group .name { font-size:14.5px; font-weight:600; }
.group .meta { font-size:12px; color:#6B7280; margin-top:1px; }
.group .amt { text-align:right; }
.group .amt .v { font-size:14px; font-weight:700; }
.group .amt .k { font-size:10.5px; color:#9CA3AF; margin-top:1px; }
.group .chevron { color:#C4C9D1; font-size:20px; font-weight:600; }
.owed { color:var(--owed); } .owe { color:var(--owe); } .settled { color:#9CA3AF; }
.newgroup { display:block; text-align:center; border:1.5px dashed #C4C9D1; border-radius:16px; padding:14px; color:var(--ptext); font-weight:700; font-size:14px; }
.empty { color:#6B7280; font-size:13px; padding:14px; background:#fff; border-radius:14px; text-align:center; }
.activity { flex:1; padding:4px 20px 16px; }
.act { display:flex; gap:11px; padding:9px 0; border-bottom:1px solid #ECEEF1; align-items:center; }
.act .aicon { width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.act .atext { flex:1; min-width:0; }
.act .t1 { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act .t1 b { font-weight:700; }
.act .t2 { font-size:11.5px; color:#6B7280; margin-top:1px; }
.act .aamt { text-align:right; flex-shrink:0; }
.act .aamt .v { font-size:13px; font-weight:700; }
.tag { display:inline-block; font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:20px; margin-top:3px; text-transform:uppercase; letter-spacing:.3px; }
.tag.unpaid { background:#FDECEC; color:#E5484D; }
.tag.paid { background:var(--owedtint); color:var(--owed); }
.daylabel { font-size:11.5px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.5px; margin:14px 0 4px; }
.fchips { display:flex; gap:8px; margin:2px 0 8px; }
.fchip { padding:8px 16px; border-radius:20px; background:#fff; font-size:13px; font-weight:600; color:#6B7280; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.fchip.on { background:var(--ptint); color:var(--ptext); }
.navwrap { position:relative; margin-top:22px; }
.fab { position:absolute; top:-26px; left:50%; transform:translateX(-50%); width:56px; height:56px; border-radius:50%; background:var(--p1); color:#fff; font-size:30px; font-weight:400; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(15,23,42,.45); border:4px solid #F6F7F9; z-index:2; }
.nav { display:flex; justify-content:space-around; background:#fff; padding:14px 10px 20px; border-top:1px solid #ECEEF1; }
.nav .item { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color:#9CA3AF; width:56px; }
.nav .item.active { color:var(--ptext); }
.nav .spacer { width:56px; }
.gcard { margin:6px 16px 14px; border-radius:20px; padding:18px; background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 60%,var(--p3) 100%); color:#fff; box-shadow:0 8px 20px rgba(15,23,42,.35); }
.gcard .lbl { font-size:12.5px; opacity:.85; }
.gcard .row { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
.gcard .big { font-size:22px; font-weight:800; }
.gcard .big .red { color:#FF5252; }
.gcard .big .grn { color:#34D399; }
.gcard .note { font-size:12px; opacity:.85; margin-top:10px; }
.members { display:flex; gap:8px; padding:0 20px; margin-bottom:14px; overflow-x:auto; }
.members .m { background:#fff; border-radius:14px; padding:10px 8px; min-width:76px; text-align:center; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.members .m .avatar { margin:0 auto 6px; }
.members .mn { font-size:12px; font-weight:600; }
.members .mb { font-size:12.5px; font-weight:700; margin-top:3px; }
.members .mbl { font-size:9px; color:#9CA3AF; margin-top:1px; }
.debt { display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.debt .who { flex:1; font-size:13.5px; font-weight:600; }
.debt .who .arrow { color:#9CA3AF; }
.debt .amt { font-size:14px; font-weight:700; }
.debt .amt.pos { color:var(--owed); }
.debt .amt.neg { color:var(--owe); }
.pill { font-size:12px; font-weight:700; padding:7px 14px; border-radius:20px; white-space:nowrap; display:inline-block; }
.pill.pay { background:var(--p1); color:#fff; }
.pill.remind { background:var(--ptint); color:var(--ptext); }
.remind-note { font-size:11.5px; color:var(--ptext); margin:-2px 4px 8px; }
.exp { display:flex; gap:11px; align-items:center; background:#fff; border-radius:14px; padding:11px 13px; margin-bottom:8px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.exp .eicon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.exp .etext { flex:1; min-width:0; }
.exp .t1 { font-size:13.5px; font-weight:600; }
.exp .t2 { font-size:11.5px; color:#6B7280; margin-top:1px; }
.exp .eamt { text-align:right; }
.exp .eamt .v { font-size:14px; font-weight:700; }
.exp .eamt .k { font-size:10.5px; color:#9CA3AF; margin-top:1px; }
.add-wrap { padding:6px 20px 26px; }
.add-btn { display:block; width:100%; text-align:center; background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; font-weight:700; font-size:15px; padding:15px; border-radius:16px; box-shadow:0 6px 16px rgba(15,23,42,.3); }
.amount-card { margin:4px 16px 16px; border-radius:20px; padding:18px; background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 60%,var(--p3) 100%); color:#fff; }
.amount-card .lbl { font-size:12.5px; opacity:.85; }
.amount-line { display:flex; align-items:baseline; gap:4px; margin:6px 0 12px; }
.amount-line .cur { font-size:22px; font-weight:700; opacity:.9; }
.amount-input { background:none; border:none; outline:none; color:#fff; font-size:34px; font-weight:800; width:100%; letter-spacing:-.5px; }
.amount-input::placeholder { color:rgba(255,255,255,.4); }
.desc-row { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.1); border-radius:12px; padding:10px 12px; }
.desc-row .pen { opacity:.8; }
.desc-input { background:none; border:none; outline:none; color:#fff; font-size:14px; width:100%; }
.desc-input::placeholder { color:rgba(255,255,255,.5); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:9px 14px; border-radius:20px; background:#fff; font-size:13px; font-weight:600; color:#6B7280; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.chip.on { background:var(--ptint); color:var(--ptext); }
.paidby { display:flex; gap:8px; flex-wrap:wrap; }
.payer { display:flex; align-items:center; gap:7px; background:#fff; border-radius:20px; padding:6px 14px 6px 6px; font-size:13px; font-weight:600; color:#6B7280; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.payer.on { background:var(--ptint); color:var(--ptext); }
.splithead { display:flex; justify-content:space-between; align-items:center; }
.splithead h2 { margin:0; }
.splitopt { font-size:12.5px; font-weight:600; color:var(--ptext); }
.member { display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 13px; margin-top:8px; width:100%; text-align:left; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.member.off { opacity:.5; }
.member .mn { flex:1; font-size:13.5px; font-weight:600; }
.member .share { font-size:13px; font-weight:700; color:#374151; }
.member .check { width:22px; height:22px; border-radius:50%; background:var(--ptint); color:var(--ptext); font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.member.off .check { background:#ECEEF1; color:transparent; }
.save-wrap { padding:8px 20px 28px; }
.save { display:block; width:100%; text-align:center; background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; font-weight:700; font-size:15px; padding:15px; border-radius:16px; box-shadow:0 6px 16px rgba(15,23,42,.3); }
.save:disabled { opacity:.45; }
.paycard { margin:6px 16px 16px; border-radius:20px; padding:20px 18px; background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 60%,var(--p3) 100%); color:#fff; text-align:center; }
.paycard .dir { display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:10px; }
.paycard .lbl { font-size:13px; opacity:.85; }
.paycard .big { font-size:32px; font-weight:800; margin:4px 0 8px; }
.paycard .ref { font-size:12px; opacity:.8; }
.methods { display:flex; gap:8px; }
.method { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:#fff; border-radius:14px; padding:12px; font-size:13px; font-weight:600; color:#6B7280; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.method.on { background:var(--ptint); color:var(--ptext); }
.method .mi { font-size:16px; }
.field { display:flex; align-items:center; gap:8px; background:#fff; border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.field .fi { color:#9CA3AF; font-weight:700; }
.field .fv { flex:1; font-size:14px; font-weight:600; }
.field .fe { color:var(--ptext); font-size:12.5px; font-weight:700; }
.field-input { flex:1; border:none; outline:none; font-size:14px; font-weight:600; color:#111; background:none; }
.cta-wrap { padding:8px 20px 28px; }
.cta { display:block; width:100%; background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; font-weight:700; font-size:15px; padding:15px; border-radius:16px; box-shadow:0 6px 16px rgba(15,23,42,.3); }
.cta:disabled { opacity:.45; }
.later { text-align:center; font-size:12px; color:#9CA3AF; margin-top:10px; }
.hint { font-size:12px; color:#9CA3AF; margin-top:8px; }
.success-wrap { padding:40px 24px 28px; text-align:center; }
.tick { width:68px; height:68px; border-radius:50%; background:var(--owed); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:0 8px 20px rgba(11,138,107,.35); }
.s-title { font-size:17px; font-weight:700; }
.s-amt { font-size:34px; font-weight:800; margin:6px 0 2px; }
.s-sub { font-size:13px; color:#6B7280; margin-bottom:20px; }
.receipt { background:#fff; border-radius:18px; padding:6px 16px; text-align:left; box-shadow:0 1px 3px rgba(16,24,40,.06); margin-bottom:14px; }
.rrow { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #ECEEF1; font-size:13px; }
.rrow:last-child { border-bottom:none; }
.rrow span { color:#6B7280; }
.rrow b { font-weight:600; }
.settle-strip { background:var(--owedtint); color:var(--owed); border-radius:14px; padding:12px 14px; font-size:13px; margin-bottom:18px; }
.profile-card { margin:6px 16px 16px; background:#fff; border-radius:20px; padding:20px; text-align:center; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.profile-card .avatar { margin:0 auto 10px; font-size:20px; }
.p-name { font-size:17px; font-weight:700; }
.p-sub { font-size:12.5px; color:#6B7280; margin-top:3px; }
.infocard { background:#fff; border-radius:14px; padding:14px; font-size:13px; color:#374151; line-height:1.5; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.toptabs { display:flex; gap:6px; padding:0 20px 12px; align-items:center; }
.toptab { flex:1; text-align:center; font-size:12px; font-weight:600; color:#6B7280; background:#fff; border-radius:12px; padding:9px 4px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.toptab.active { color:var(--ptext); background:var(--ptint); }
.toptab.add { flex:0 0 44px; background:var(--p1); color:#fff; font-size:18px; font-weight:400; }

/* friends mode */
.auth-wrap { padding:36px 24px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.auth-logo { font-size:30px; font-weight:800; color:var(--ptext); font-family:'Noto Sans Kannada','Inter',sans-serif; margin:14px 0 2px; }
.auth-logo span { color:#111; font-family:'Inter',sans-serif; }
.auth-sub { font-size:13.5px; color:#6B7280; margin:6px 0 20px; max-width:290px; line-height:1.5; }
.auth-card { background:#fff; border-radius:18px; padding:18px; width:100%; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.auth-card input { width:100%; border:1.5px solid #E5E7EB; border-radius:12px; padding:13px 14px; font-size:15px; outline:none; }
.auth-card input:focus { border-color:var(--ptext); }
.auth-btn { display:block; width:100%; margin-top:12px; background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; font-weight:700; font-size:15px; padding:14px; border-radius:14px; text-align:center; }
.auth-btn[disabled] { opacity:.5; }
.g-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px; border-radius:14px; border:1.5px solid #E5E7EB; background:#fff; font-weight:700; font-size:14px; color:#111827; cursor:pointer; margin-bottom:10px; }
.g-btn:active { background:#F9FAFB; }
.g-btn:disabled { opacity:.6; }
.auth-or { display:flex; align-items:center; gap:10px; margin:4px 0 12px; color:#9CA3AF; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.auth-or::before, .auth-or::after { content:""; flex:1; height:1px; background:#E5E7EB; }
.auth-note { font-size:12px; color:#9CA3AF; margin-top:12px; line-height:1.5; }
.later-btn { display:block; margin:10px auto 0; background:none; border:none; color:#9CA3AF; font-weight:600; font-size:13px; cursor:pointer; }
.memrow { display:flex; gap:10px; align-items:center; background:#fff; border-radius:14px; padding:10px 12px; margin-bottom:8px; }
.meminfo { flex:1; min-width:0; }
.memname { font-weight:700; font-size:13.5px; margin-bottom:2px; }
.memsub { font-size:11.5px; color:#6B7280; line-height:1.5; }
.stchip { font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px; vertical-align:1px; }
.st-done { background:#E5F6F1; color:#0B8A6B; }
.st-pend { background:#FDECEC; color:#E5484D; }
.st-recv { background:#FDF0E0; color:#B45309; }
.delall { background:none; border:none; color:#E5484D; font-size:12.5px; font-weight:700; cursor:pointer; padding:2px 4px; }
.tottail { display:flex; justify-content:space-between; align-items:center; padding:12px 6px 2px; font-size:14px; color:#6B7280; }
.tottail b { color:#111827; font-size:15px; }
.upi-qr { display:flex; justify-content:center; padding:6px 0 10px; }
.upi-qr svg { width:150px; height:150px; background:#fff; border-radius:12px; padding:8px; }
.upi-fallback { background:#FFF7ED; color:#92400E; border-radius:14px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:12px; }
.copybtn { display:inline-block; margin-top:8px; background:#fff; border:1px solid #F59E0B; color:#B45309; border-radius:10px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
@keyframes tickpop { 0% { transform:scale(.3); opacity:0 } 60% { transform:scale(1.15); opacity:1 } 100% { transform:scale(1); opacity:1 } }
.success-wrap .tick { animation:tickpop .5s ease-out both; }
.seg { display:flex; background:#ECEEF1; border-radius:12px; padding:3px; gap:2px; }
.seg button { flex:1; border:none; background:none; border-radius:10px; padding:7px 0; font-size:12px; font-weight:700; color:#6B7280; cursor:pointer; }
.seg button.on { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(16,24,40,.12); }
.splitin { width:84px; text-align:right; border:1px solid #E5E7EB; border-radius:9px; padding:5px 8px; font-size:13px; font-weight:600; font-family:inherit; }
.splitin.bad { border-color:#E5484D; background:#FDECEC; }

<body>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./qrcode.min.js"></script>
<div class="app" id="app"></div>
<script>
'use strict';
/* ============ data layer ============ */
const KEY = 'namma-split.pwa.v1';
const YOU = 'You';
const CFG = window.NAMMA_CONFIG || {};
let sb = null, SBU = null, MYNAME = '', MYMAP = {}, syncTimer = null, rtChannel = null, rtStatus = '';
let loginSent = false, loginBusy = false, loginErr = '', joinBusy = false, joinErr = '', ngShared = true;

const H = 3600e3, D = 24 * H;
let S = { groups: [], expenses: [], payments: [], upiIds: {}, directs: [] };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
function migrate() {
    S.directs = S.directs || []; S.recurring = S.recurring || []; S.trash = S.trash || [];
    (S.expenses || []).forEach(e => {
        if (e.amountP === undefined) {
            e.amountP = P(e.amount);
            e.payers = Array.isArray(e.payers) && e.payers.length ? e.payers.map(x => ({ name: x.name, p: x.p !== undefined ? x.p : P(x.amount) })) : [{ name: e.paidBy, p: e.amountP }];
            const sp = {}; Object.entries(e.splits || {}).forEach(([m, v]) => { sp[m] = P(v); });
            e.splitsP = sp;
            delete e.amount; delete e.paidBy; delete e.splits;
        }
    });
    (S.payments || []).forEach(p => { if (p.amountP === undefined) { p.amountP = P(p.amount); delete p.amount; } });
}
migrate();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
window.addEventListener('storage', (ev) => {
    if (ev.key !== KEY || !ev.newValue) return;
    try {
        const fresh = JSON.parse(ev.newValue);
        S.groups = fresh.groups || []; S.expenses = fresh.expenses || []; S.payments = fresh.payments || []; S.upiIds = fresh.upiIds || {}; S.directs = fresh.directs || []; S.recurring = fresh.recurring || []; S.trash = fresh.trash || [];
        migrate(); render();
    } catch (e) {}
});
let idc = 0;
function newId(p) { idc++; return p + Date.now().toString(36) + idc.toString(36); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function P(x) { return Math.round((Number(x) || 0) * 100); }
function fmt(p) { p = Math.round(Number(p) || 0); const v = Math.abs(p) / 100; return (p < 0 ? '-₹' : '₹') + v.toLocaleString('en-IN', { minimumFractionDigits: (Math.abs(p) % 100) ? 2 : 0, maximumFractionDigits: 2 }); }
function getGroup(id) {
    const g = S.groups.find(g => g.id === id); if (g) return g;
    const d = (S.directs || []).find(d => d.id === id);
    return d ? { id: d.id, name: d.name, icon: '\u{1F464}', tint: '#E0F2FE', members: [YOU, d.name], direct: true } : undefined;
}
function knownPeople() {
    const set = new Set();
    S.groups.forEach(g => g.members.forEach(m => { if (m !== YOU) set.add(m); }));
    (S.directs || []).forEach(d => set.add(d.name));
    return [...set].sort();
}
function resolveDirect(name) {
    const n = name.trim(); if (!n) return null;
    let d = (S.directs || []).find(d => d.name.toLowerCase() === n.toLowerCase());
    if (!d) { d = { id: newId('d'), name: n }; S.directs.push(d); }
    return d;
}
function memberNet(groupId) {
    const net = {}; const g = getGroup(groupId); if (!g) return net;
    g.members.forEach(m => { net[m] = 0; });
    S.expenses.filter(e => e.groupId === groupId && !e.settled).forEach(e => {
        (e.payers || []).forEach(py => { net[py.name] = (net[py.name] || 0) + py.p; });
        Object.entries(e.splitsP || {}).forEach(([m, sh]) => { net[m] = (net[m] || 0) - sh; });
    });
    S.payments.filter(p => p.groupId === groupId).forEach(p => {
        net[p.from] = (net[p.from] || 0) + p.amountP;
        net[p.to] = (net[p.to] || 0) - p.amountP;
    });
    return net;
}
function simplifyDebts(net) {
    const ds = Object.entries(net).filter(([,v]) => v < 0).map(([m,v]) => ({ m, a: -v })).sort((x,y) => y.a - x.a);
    const cs = Object.entries(net).filter(([,v]) => v > 0).map(([m,v]) => ({ m, a: v })).sort((x,y) => y.a - x.a);
    const out = []; let i = 0, j = 0;
    while (i < ds.length && j < cs.length) {
        const pay = Math.min(ds[i].a, cs[j].a);
        out.push({ from: ds[i].m, to: cs[j].m, amount: pay });
        ds[i].a -= pay; cs[j].a -= pay;
        if (ds[i].a === 0) i++; if (cs[j].a === 0) j++;
    }
    return out;
}
function contributions(groupId) {
    const c = {};
    S.expenses.filter(e => e.groupId === groupId).forEach(e => { (e.payers || []).forEach(py => { c[py.name] = (c[py.name] || 0) + py.p; }); });
    return c;
}
function shares(groupId) {
    const sh = {};
    S.expenses.filter(e => e.groupId === groupId && !e.settled).forEach(e => { Object.entries(e.splitsP || {}).forEach(([m, v]) => { sh[m] = (sh[m] || 0) + v; }); });
    return sh;
}
function settlementMoves(groupId) {
    const out = {}, inn = {};
    S.payments.filter(p => p.groupId === groupId).forEach(p => { out[p.from] = (out[p.from] || 0) + p.amountP; inn[p.to] = (inn[p.to] || 0) + p.amountP; });
    return { out, inn };
}
function equalSplits(amountP, members) {
    const n = members.length, base = Math.floor(amountP / n);
    let rem = amountP - base * n; const out = {};
    members.forEach(m => { out[m] = base + (rem-- > 0 ? 1 : 0); });
    return out;
}
function payerLabel(e) { return (e.payers || []).length === 1 ? (e.payers[0].name === YOU ? 'you' : e.payers[0].name) : e.payers.length + ' payers'; }

const CATEGORIES = [
    { name: 'Food', icon: '🍽️', tint: '#FDECEC' }, { name: 'Travel', icon: '✈️', tint: '#FFF3E0' },
    { name: 'Rent', icon: '🏠', tint: '#E5F6F1' }, { name: 'Utilities', icon: '⚡', tint: '#FFF3E0' },
    { name: 'Shopping', icon: '🛒', tint: '#EDE9FE' }, { name: 'Other', icon: '⋯', tint: '#ECEEF1' },
];
function catStyle(name) { const c = CATEGORIES.find(x => x.name === name); return c || { name: 'Other', icon: '⋯', tint: '#ECEEF1' }; }
const AV_COLORS = ['#F59E0B','#60A5FA','#34D399','#F472B6','#A78BFA','#FB923C','#38BDF8','#F87171'];
function avatarColor(name) { if (name === YOU) return 'navy'; let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function relTime(date, now) {
    const diff = now - date;
    if (diff < H) return Math.max(1, Math.round(diff / 60e3)) + 'm ago';
    if (diff < D) return Math.round(diff / H) + 'h ago';
    const d = new Date(date), n = new Date(now);
    const dd = Math.floor((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / D);
    if (dd === 1) return 'Yesterday';
    if (dd < 7) return dd + ' days ago';
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}
function dayBucket(date, now) {
    const d = new Date(date), n = new Date(now);
    const dd = Math.floor((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / D);
    if (dd <= 0) return 'Today'; if (dd === 1) return 'Yesterday'; if (dd < 7) return 'This week'; return 'Earlier';
}
/* ============ shared UI ============ */
function avatar(name, size) {
    const c = avatarColor(name);
    const bg = c === 'navy' ? 'linear-gradient(135deg,#0F172A,#1E293B)' : c;
    return `<div class="avatar" style="width:${size || 36}px;height:${size || 36}px;background:${bg}">${esc(name === YOU ? 'Y' : name[0])}</div>`;
}
const NAVI = {
    home: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
    groups: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    activity: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    profile: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
};
function bottomNav(active) {
    const it = (k, h, l) => `<a href="${h}" class="item${active === k ? ' active' : ''}">${NAVI[k]}${l}</a>`;
    return `<div class="navwrap"><a href="#/add" class="fab" aria-label="Add expense">+</a><div class="nav">${it('home','#/','Home')}${it('groups','#/groups','Groups')}<div class="spacer"></div>${it('activity','#/activity','Activity')}${it('profile','#/profile','Profile')}</div></div>`;
}
function topTabs(active) {
    const t = (k, h, l) => `<a href="${h}" class="toptab${active === k ? ' active' : ''}">${l}</a>`;
    return `<div class="toptabs">${t('home','#/','Home')}${t('groups','#/groups','Groups')}<a href="#/add" class="toptab add" aria-label="Add expense">+</a>${t('activity','#/activity','Activity')}${t('profile','#/profile','Profile')}</div>`;
}
function logoHeader() { return `<div class="header"><div class="logo">ನಮ್ಮ <span>Split</span></div><div class="right">${avatar(YOU, 34)}</div></div>`; }
function backHeader(title, sub, to) {
    return `<div class="header"><a href="${to}" class="back" aria-label="Back"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><div class="htext"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div style="width:34px"></div></div>`;
}
function expenseRow(e, now) {
    const g = getGroup(e.groupId), c = catStyle(e.category), ys = (e.splitsP || {})[YOU] || 0, yp = (e.payers || []).some(x => x.name === YOU);
    const myPaid = (e.payers || []).filter(x => x.name === YOU).reduce((a, x) => a + x.p, 0);
    let amt;
    if (e.settled) amt = `<div class="v" style="color:#9CA3AF">${fmt(e.amountP)}</div><span class="tag paid">Settled</span>`;
    else if (yp) amt = `<div class="v owed">${fmt(myPaid - ys)}</div><span class="tag paid">Paid</span>`;
    else if (ys > 0) amt = `<div class="v owe">${fmt(ys)}</div><span class="tag unpaid">Unpaid</span>`;
    else amt = `<div class="v" style="color:#9CA3AF">${fmt(e.amountP)}</div><span class="tag paid">Not in split</span>`;
    return `<div class="act" onclick="editExpense('${e.id}')" style="cursor:pointer"><div class="aicon" style="background:${c.tint}">${c.icon}</div><div class="atext"><div class="t1"><b>${esc(payerLabel(e))}</b> added &ldquo;${esc(e.title)}&rdquo;</div><div class="t2">${g ? esc(g.name) : ''} · split ${Object.keys(e.splitsP || {}).length} ways · ${relTime(e.date, now)}</div></div><div class="aamt">${amt}</div></div>`;
}
function paymentRow(p, now) {
    const g = getGroup(p.groupId), inc = p.to === YOU;
    return `<div class="act"><div class="aicon" style="background:#E5F6F1">💸</div><div class="atext"><div class="t1"><b>${esc(p.from)}</b> paid <b>${esc(p.to)}</b></div><div class="t2">${g ? esc(g.name) : ''} · ${esc(p.method)} · ${relTime(p.date, now)}</div></div><div class="aamt"><div class="v ${inc ? 'owed' : 'owe'}">${inc ? '+' : '−'}${fmt(p.amountP)}</div><span class="tag paid">${esc(p.method)}</span></div></div>`;
}
/* ============ screens ============ */
const ui = { openGroupId: null, settleSel: null, lastPayment: null, reminded: '', actFilter: 'all', addForm: null, editId: null, upiPending: false, saving: false, payAmtText: '', settleErr: '' };
function totals() {
    let owe = 0, owed = 0;
    S.groups.forEach(g => { const n = memberNet(g.id)[YOU] || 0; if (n < 0) owe += -n; else if (n > 0) owed += n; });
    (S.directs || []).forEach(d => { const n = memberNet(d.id)[YOU] || 0; if (n < 0) owe += -n; else if (n > 0) owed += n; });
    return { owe, owed, net: owed - owe };
}
function directRowHtml(d) {
    const n = memberNet(d.id)[YOU] || 0;
    const lbl = n === 0 ? 'settled up' : n < 0 ? `you owe ${fmt(-n)}` : `owes you ${fmt(n)}`;
    return `<div class="group" onclick="ui.openGroupId='${d.id}';location.hash='#/group'" style="cursor:pointer"><div class="icon" style="background:#E0F2FE">\u{1F464}</div><div class="gtext"><div class="gname">${esc(d.name)}</div><div class="gsub">1-on-1 · ${S.expenses.filter(e => e.groupId === d.id).length} expenses</div></div><div class="gbal ${n < 0 ? 'neg' : n > 0 ? 'pos' : ''}">${lbl}</div></div>`;
}
function groupRowHtml(g) {
    const n = memberNet(g.id)[YOU] || 0;
    const pending = S.expenses.filter(e => e.groupId === g.id && !e.settled).length;
    const others = g.members.filter(m => m !== YOU);
    const meta = others.length > 3 ? `${g.members.length} members` : esc(others.join(', ')) + ' + you';
    const v = n === 0 ? `<div class="v settled">settled up</div>` : `<div class="v ${n < 0 ? 'owe' : 'owed'}">${n < 0 ? 'you owe ' : 'owed '}${fmt(Math.abs(n))}</div>`;
    return `<a href="#/group" class="group" onclick="ui.openGroupId='${g.id}'"><div class="icon" style="background:${g.tint}">${g.icon}</div><div class="info"><div class="name">${esc(g.name)}</div><div class="meta">${meta}</div></div><div class="amt">${v}<div class="k">${pending === 0 ? 'all paid' : pending + ' pending'}</div></div></a>`;
}
function scrHome() {
    const now = Date.now(), t = totals();
    const isFresh = S.groups.length === 0 && S.expenses.length === 0 && S.payments.length === 0;
    const hasDebts = S.groups.some(g => (memberNet(g.id)[YOU] || 0) !== 0);
    const recent = [...S.expenses.filter(e => !e.settled).map(e => ({ k: 'e', date: e.date, e })), ...S.payments.map(p => ({ k: 'p', date: p.date, p }))].sort((a, b) => b.date - a.date).slice(0, 4);
    const card = isFresh
        ? `<div class="balance-card"><div class="label">Welcome to</div><div class="big">ನಮ್ಮ Split</div><div class="balance-row"><div style="font-size:12.5px;opacity:.9;max-width:220px;line-height:1.45">Create your first group to start splitting rent, trips and dinners.</div><a href="#/new-group" class="settle-btn">+ New group</a></div></div>`
        : `<div class="balance-card"><div class="label">${t.net === 0 ? 'Overall balance' : t.net > 0 ? 'Overall, you are owed' : 'Overall, you owe'}</div><div class="big">${t.net === 0 ? 'All settled' : fmt(Math.abs(t.net))}</div><div class="balance-row"><div class="mini"><div class="item"><div class="k">You owe</div><div class="v" style="color:#FF5252">${fmt(t.owe)}</div></div><div class="item"><div class="k">Owed to you</div><div class="v" style="color:#34D399">${fmt(t.owed)}</div></div></div>${hasDebts ? `<a href="#/settle" class="settle-btn" onclick="ui.settleSel=null">Settle up</a>` : `<span class="settle-btn" style="opacity:.7">All settled</span>`}</div></div>`;
    return logoHeader() + topTabs('home') + card
        + `<div class="section"><div class="section-title"><h2>Your groups</h2><a href="#/new-group" class="link">+ New group</a></div>`
        + (S.groups.length === 0 ? `<a href="#/new-group" class="newgroup">+ Create your first group</a>` : S.groups.map(groupRowHtml).join('')) + `</div>`
        + ((S.directs || []).length ? `<div class="section"><div class="section-title"><h2>People (1-on-1)</h2><a href="#/add" class="link" onclick="ui.addForm=null;ui.addDirectNew=true">+ New 1-on-1</a></div>` + (S.directs || []).map(directRowHtml).join('') + `</div>` : `<div class="section"><a href="#/add" class="newgroup" onclick="ui.addForm=null;ui.addDirectNew=true">+ Add a 1-on-1 expense (no group)</a></div>`)
        + `<div class="activity"><div class="section-title" style="margin-top:10px"><h2>Recent activity</h2><a href="#/activity" class="link">See all</a></div>`
        + (recent.length === 0 ? `<div class="empty">Nothing yet. Tap + to add your first expense.</div>` : recent.map(r => r.k === 'e' ? expenseRow(r.e, now) : paymentRow(r.p, now)).join('')) + `</div>`
        + bottomNav('home');
}
function scrGroups() {
    const t = totals();
    const expCount = S.expenses.length;
    return `<div class="header"><div class="logo">ನಮ್ಮ <span>Split</span></div><div class="right"></div></div>` + topTabs('groups')

function doRecord() { doRecordImpl(); }
function doRecordImpl() {
    const sel = ui.settleSel;
    if (!sel) { render(); return; }
    const debt = simplifyDebts(memberNet(sel.groupId)).find(d => d.from === sel.from && d.to === sel.to);

    const amtP = P(parseFloat(ui.payAmtText || '0') || 0);
    if (amtP <= 0) { ui.settleErr = 'Enter an amount.'; render(); return; }
    if (amtP > debt.amount) { ui.settleErr = 'That is more than the ' + fmt(debt.amount) + ' remaining.'; render(); return; }
    const g = getGroup(sel.groupId);
    const p = { id: newId('p'), groupId: sel.groupId, from: sel.from, to: sel.to, amountP: amtP, date: Date.now(), method: settleMethod };
    if (g && g.remote) {
        sb.from('settlements').insert({ group_id: g.rid, from_name: fromYouIn(g.rid, sel.from), to_name: fromYouIn(g.rid, sel.to), amount: amtP / 100, method: settleMethod, created_by: SBU.id })
            .then(({ error }) => { if (error) { S.payments = S.payments.filter(x => x.id !== p.id); save(); alert('Could not record: ' + error.message); render(); } debSync(); });
        p.remote = true;
    }
    S.payments.unshift(p); save();

    playSuccessSound();

        try { const q = qrcode(0, 'M'); q.addData(ui.lastUpiUrl); q.make(); qel.innerHTML = q.createSvgTag(5, 2); } catch (e) { qel.innerHTML = ''; }
    }
}
function copyUpi(btn, upi, amtP) {
    const text = upi + ' - ' + fmt(amtP);
    const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy UPI ID + amount'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
}
